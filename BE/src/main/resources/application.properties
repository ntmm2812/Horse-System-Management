spring.application.name=horse-management
server.port=8080

# Never create or modify the database schema automatically.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Temporary: allow startup without database connection details.
# Remove this exclusion when you are ready to configure SQL Server.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
