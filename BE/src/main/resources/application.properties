spring.application.name=horse-management
server.port=8080

# Resolve .env from the working directory (set it to BE in Maven/IntelliJ).
# The extension hint uses Spring Boot's standard Java properties loader.
spring.config.import=optional:file:./.env[.properties]

# Never create or modify the database schema automatically.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# OS environment variables take precedence over the local .env file.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:horse_management};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
